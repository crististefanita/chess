name: Publish Chess Web

on:
  push:
    branches: [main]
    paths:
      - web/publication.request
  workflow_dispatch:
    inputs:
      site_commit:
        description: Exact Git commit of the qualified static site
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the qualified site's Git tree listing
        required: true
        type: string

permissions: {}
concurrency:
  group: chess-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the publication request
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: request-source
      - name: Check the requested identity
        id: request
        shell: bash
        env:
          SITE_COMMIT: ${{ inputs.site_commit }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            node request-source/web/scripts/validate-publication-request.mjs \
              request-source/web/publication.request >> "$GITHUB_OUTPUT"
          else
            [[ "$SITE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            printf 'site_commit=%s\nmanifest_sha256=%s\n' "$SITE_COMMIT" "$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the qualified site tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.request.outputs.site_commit }}
          persist-credentials: false
          path: site-source
      - name: Verify and extract the site
        shell: bash
        env:
          SITE_COMMIT: ${{ steps.request.outputs.site_commit }}
          MANIFEST_SHA256: ${{ steps.request.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C site-source rev-parse HEAD)" = "$SITE_COMMIT"
          actual=$(git -C site-source ls-tree -r --full-tree "$SITE_COMMIT" | sha256sum)
          test "${actual%% *}" = "$MANIFEST_SHA256"
          git -C site-source ls-tree -r --full-tree "$SITE_COMMIT" |
            awk '$1 != "100644" && $1 != "100755" { invalid = 1 } END { exit invalid }'
          mkdir "$RUNNER_TEMP/chess-site"
          git -C site-source archive "$SITE_COMMIT" | tar -x -C "$RUNNER_TEMP/chess-site"
          test -s "$RUNNER_TEMP/chess-site/index.html"
          test -d "$RUNNER_TEMP/chess-site/runtime"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload the verified site
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/chess-site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHESS_PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.CHESS_PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) throw new Error('Missing exact upload receipt');
            const scope = { owner: context.repo.owner, repo: context.repo.repo };
            const artifact = (await github.rest.actions.getArtifact({ ...scope, artifact_id: artifactId })).data;
            if (artifact.id !== artifactId || artifact.name !== 'github-pages' || artifact.expired
                || artifact.workflow_run?.id !== context.runId) throw new Error('Foreign or expired Pages artifact');
            const created = (await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...scope, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: await core.getIDToken()
            })).data;
            if (!created.id || !created.page_url) throw new Error('Missing Pages deployment receipt');
            const deployment = { ...scope, deploymentId: created.id };
            try {
              for (let attempt = 0; attempt < 120; attempt++) {
                const observed = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', deployment)).data;
                if (observed.status === 'succeed') { core.setOutput('page_url', created.page_url); return; }
                if (/failed|cancelled|lost|purged/.test(observed.status ?? '')) throw new Error('Pages deployment: ' + observed.status);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              throw new Error('Pages deployment timed out');
            } catch (failure) {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', deployment).catch(() => {});
              throw failure;
            }
